name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare configuration
        id: cloudflare
        shell: bash
        run: |
          missing_names=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_ENCRYPTION_KEY SESSION_SECRET SETUP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::notice::Cloudflare deployment skipped: GitHub Actions secret ${name} is not configured."
              missing_names+=("$name")
            fi
          done

          if [ "${#missing_names[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            printf -v joined '%s,' "${missing_names[@]}"
            joined="${joined%,}"
            echo "missing=$joined" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare is not configured yet
        if: steps.cloudflare.outputs.configured != 'true'
        run: echo "Application code is valid, but production deployment waits for the documented GitHub Actions secrets."

      - uses: actions/setup-node@v6
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify Cloudflare token and D1 access
        id: access
        if: steps.cloudflare.outputs.configured == 'true'
        run: node scripts/verify-cloudflare-access.mjs

      - name: Install dependencies
        id: install
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm install --no-audit --no-fund

      - name: Quality gate
        id: quality
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          npm run cf:types
          npm run typecheck
          npm run lint
          npm test
          npm run security:scan
          npm run build

      - name: Prepare D1 binding
        id: d1
        if: steps.cloudflare.outputs.configured == 'true'
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Prepare Worker secrets
        id: worker_secrets
        if: steps.cloudflare.outputs.configured == 'true'
        run: node scripts/write-deploy-secrets.mjs

      - name: Apply D1 migrations
        id: migrations
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply solar-edge-hue --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker, dashboard and secrets
        id: deploy
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          set +e
          set -o pipefail
          npx wrangler deploy --config wrangler.deploy.jsonc --secrets-file .cloudflare-secrets.json 2>&1 | tee deploy-output.log
          code=${PIPESTATUS[0]}
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy-output.log | tail -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Cleanup temporary secret files
        if: always()
        run: rm -f .cloudflare-secrets.json wrangler.deploy.jsonc deploy-output.log

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          CONFIGURED: ${{ steps.cloudflare.outputs.configured }}
          MISSING_SECRETS: ${{ steps.cloudflare.outputs.missing }}
          JOB_STATUS: ${{ job.status }}
          ACCESS_OUTCOME: ${{ steps.access.outcome }}
          TOKEN_STATUS: ${{ steps.access.outputs.token_status }}
          D1_ACCESS_STATUS: ${{ steps.access.outputs.d1_status }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          D1_OUTCOME: ${{ steps.d1.outcome }}
          D1_ERROR_CODE: ${{ steps.d1.outputs.error_code }}
          WORKER_SECRETS_OUTCOME: ${{ steps.worker_secrets.outcome }}
          MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          publish_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            local target_url="${4:-}"
            args=(
              -X POST
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
              -f "state=$state"
              -f "context=$context"
              -f "description=$description"
            )
            if [ -n "$target_url" ]; then
              args+=( -f "target_url=$target_url" )
            fi
            gh api "${args[@]}" >/dev/null
          }

          if [ "$CONFIGURED" != "true" ]; then
            publish_status "cloudflare/deploy" "error" "Cloudflare deployment not configured"
            IFS=',' read -r -a missing <<< "$MISSING_SECRETS"
            for secret in "${missing[@]}"; do
              if [ -n "$secret" ]; then
                publish_status "cloudflare/missing/$secret" "error" "GitHub Actions secret missing"
              fi
            done
          elif [ "$JOB_STATUS" = "success" ]; then
            publish_status "cloudflare/access/token-$TOKEN_STATUS" "success" "Cloudflare token preflight"
            publish_status "cloudflare/access/d1-$D1_ACCESS_STATUS" "success" "Cloudflare D1 access preflight"
            publish_status "cloudflare/deploy" "success" "Cloudflare deployment successful" "$DEPLOY_URL"
          else
            publish_status "cloudflare/deploy" "failure" "Cloudflare deployment failed" "$DEPLOY_URL"
            if [ -n "$TOKEN_STATUS" ]; then
              publish_status "cloudflare/access/token-$TOKEN_STATUS" "failure" "Cloudflare token preflight"
            fi
            if [ -n "$D1_ACCESS_STATUS" ]; then
              publish_status "cloudflare/access/d1-$D1_ACCESS_STATUS" "failure" "Cloudflare D1 access preflight"
            fi
            if [ "$ACCESS_OUTCOME" = "failure" ]; then
              publish_status "cloudflare/failure/access-preflight" "failure" "Cloudflare access preflight failed"
            elif [ "$INSTALL_OUTCOME" = "failure" ]; then
              publish_status "cloudflare/failure/npm-install" "failure" "Dependency installation failed"
            elif [ "$QUALITY_OUTCOME" = "failure" ]; then
              publish_status "cloudflare/failure/quality-gate" "failure" "Quality gate failed"
            elif [ "$D1_OUTCOME" = "failure" ]; then
              publish_status "cloudflare/failure/d1-binding" "failure" "D1 prepare/create/list failed"
              if [ -n "$D1_ERROR_CODE" ]; then
                publish_status "cloudflare/d1-error/$D1_ERROR_CODE" "failure" "Safe D1 failure category"
              fi
            elif [ "$WORKER_SECRETS_OUTCOME" = "failure" ]; then
              publish_status "cloudflare/failure/worker-secrets" "failure" "Worker secret preparation failed"
            elif [ "$MIGRATIONS_OUTCOME" = "failure" ]; then
              publish_status "cloudflare/failure/d1-migrations" "failure" "D1 migration failed"
            elif [ "$DEPLOY_OUTCOME" = "failure" ]; then
              publish_status "cloudflare/failure/worker-deploy" "failure" "Worker deployment failed" "$DEPLOY_URL"
            else
              publish_status "cloudflare/failure/unknown-stage" "failure" "Deployment failed before a classified stage"
            fi
          fi
