name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare configuration
        id: cloudflare
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_ENCRYPTION_KEY SESSION_SECRET SETUP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::notice::Cloudflare deployment skipped: GitHub Actions secret ${name} is not configured."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare is not configured yet
        if: steps.cloudflare.outputs.configured != 'true'
        run: echo "Application code is valid, but production deployment waits for the five documented GitHub Actions secrets."

      - uses: actions/setup-node@v6
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm install --no-audit --no-fund

      - name: Quality gate
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          npm run cf:types
          npm run typecheck
          npm run lint
          npm test
          npm run security:scan
          npm run build

      - name: Prepare D1 binding
        id: d1
        if: steps.cloudflare.outputs.configured == 'true'
        run: node scripts/prepare-cloudflare-deploy.mjs

      - name: Prepare Worker secrets
        if: steps.cloudflare.outputs.configured == 'true'
        run: node scripts/write-deploy-secrets.mjs

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply solar-edge-hue --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker, dashboard and secrets
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler deploy --config wrangler.deploy.jsonc --secrets-file .cloudflare-secrets.json

      - name: Cleanup temporary secret files
        if: always()
        run: rm -f .cloudflare-secrets.json wrangler.deploy.jsonc
